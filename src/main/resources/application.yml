server:
  # Порт вынесен в переменную окружения, чтобы запускать несколько инстансов
  # (GitHub Actions — 8081, Jenkins — 8082) на одном сервере.
  port: ${SERVER_PORT:8080}

app:
  # CI-провайдер задаётся переменной окружения CI_PROVIDER при запуске инстанса.
  ci-provider: ${CI_PROVIDER:локальной сборки}
  status:
    # %s — CI-провайдер, дата (dd-yyyy-MM) и время (HH:mm:ss) старта приложения.
    message: "Приложение собрано с помощью %s, запущено %s в %s и находится в рабочем состоянии"
