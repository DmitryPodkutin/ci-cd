name: Build and Deploy Java 17 (Gradle)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build with Gradle
        run: gradle build -x test

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 10 ${{ secrets.DEPLOY_SERVER }} >> ~/.ssh/known_hosts

      - name: Copy JAR via SCP
        run: |
          scp -i ~/.ssh/id_rsa build/libs/*-SNAPSHOT.jar ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }}:${{ secrets.DEPLOY_PATH }}/application.jar

      - name: Restart application
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }} \
            "pkill -f '[j]ava -jar' || true; \
             nohup java -jar ${{ secrets.DEPLOY_PATH }}/application.jar > ${{ secrets.DEPLOY_PATH }}/app.log 2>&1 </dev/null &"
