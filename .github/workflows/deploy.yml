name: Build and Deploy Java 17 (Gradle)

on:
  push:
    branches: [ main ]

env:
  # Порт инстанса, собранного в GitHub Actions.
  # Инстанс из Jenkins запускается на другом порту (см. Jenkinsfile).
  APP_PORT: "8081"
  APP_CI_PROVIDER: "GitHub CI"
  APP_JAR_NAME: "app-github.jar"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build with Gradle
        run: gradle build -x test

      - name: Run tests
        run: gradle test

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 10 ${{ secrets.DEPLOY_SERVER }} >> ~/.ssh/known_hosts

      - name: Copy JAR via SCP
        run: |
          scp -i ~/.ssh/id_rsa build/libs/*-SNAPSHOT.jar ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }}:${{ secrets.DEPLOY_PATH }}/${{ env.APP_JAR_NAME }}

      - name: Restart application
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }} "pkill -f 'app-[g]ithub.jar' || true"
          sleep 2
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }} "cd ${{ secrets.DEPLOY_PATH }} && SERVER_PORT=${{ env.APP_PORT }} CI_PROVIDER=\"${{ env.APP_CI_PROVIDER }}\" nohup java -jar ${{ env.APP_JAR_NAME }} > ${{ env.APP_JAR_NAME }}.log 2>&1 </dev/null &"
